<!doctype html>
<html lang="is">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contador</title>
<meta name="description" content="Contador – ráðgjafarfyrirtæki, Hlíðasmára 2, 201 Kópavogi.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='22' fill='%23fff'/%3E%3Cpath d='M96 30 A44 44 0 1 0 96 90' fill='none' stroke='%2314324a' stroke-width='14' stroke-linecap='square'/%3E%3Crect x='50' y='44' width='40' height='7' fill='%23c8a45c'/%3E%3Crect x='50' y='56.5' width='30' height='7' fill='%23c8a45c'/%3E%3Crect x='50' y='69' width='20' height='7' fill='%23c8a45c'/%3E%3C/svg%3E">
<style>
  :root { --navy: #14324a; --accent: #c8a45c; --ink: #1b1f24; --muted: #66707a; --line: #e6e8eb; --bg: #fbfaf7; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 48px 16px;
  }
  .logo { width: clamp(72px, 18vw, 96px); height: auto; margin-bottom: 18px; }
  .mark {
    font-family: Georgia, "Times New Roman", serif; font-weight: 400;
    font-size: clamp(2.6rem, 9vw, 4.2rem); letter-spacing: .01em; color: var(--navy); margin: 0;
  }
  .rule { width: 56px; height: 2px; background: var(--accent); margin: 22px auto 22px; border: 0; }
  .tag { margin: 0; font-size: .82rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
  address { font-style: normal; margin-top: 28px; color: var(--ink); line-height: 1.7; }
  .btn {
    display: inline-block; margin-top: 32px; padding: 12px 28px; border-radius: 4px;
    background: var(--navy); color: #fff; text-decoration: none; font-weight: 600; font-size: .95rem;
    transition: background .15s;
  }
  .btn:hover { background: #0c2233; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  footer {
    border-top: 1px solid var(--line); padding: 20px 16px; text-align: center;
    font-size: .8rem; color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <svg class="logo" viewBox="0 0 120 120" role="img" aria-label="Contador merki">
    <path d="M96 30 A44 44 0 1 0 96 90" fill="none" stroke="#14324a" stroke-width="14" stroke-linecap="square"/>
    <rect x="50" y="44" width="40" height="7" fill="#c8a45c"/>
    <rect x="50" y="56.5" width="30" height="7" fill="#c8a45c"/>
    <rect x="50" y="69" width="20" height="7" fill="#c8a45c"/>
  </svg>
  <h1 class="mark">Contador</h1>
  <hr class="rule">
  <p class="tag">Ráðgjöf</p>
  <address>Hlíðasmára 2<br>201 Kópavogi</address>
  <a class="btn" id="mail" href="#">Senda póst</a>
</main>
<footer>Contador · kt. 620416-0610</footer>
<script>
  // Netfangið er sett saman í vafranum svo það sjáist ekki í HTML-kóðanum.
  (function () {
    var u = "ingvaldur", d = "ingvaldur" + "." + "com";
    document.getElementById("mail").href = "mailto:" + u + "@" + d;
  })();
</script>
</body>
</html>
